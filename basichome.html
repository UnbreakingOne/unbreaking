<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cool Dark Theme App</title>
    <style>
        /* --- Custom Font Setup --- */
        @font-face {
            font-family: 'Mojangles';
            src: url('Mojangles.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* --- Base Page Setup --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mojangles', 'Courier New', Courier, monospace; 
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 90px;
            background: linear-gradient(180deg, #121212 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            border-right: 1px solid #333;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-link {
            margin-bottom: 20px;
            display: block;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            text-decoration: none;
        }

        /* Standard image links */
        .sidebar-link img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 12px;
            transition: all 0.4s ease;
            opacity: 0.7;
            display: block;
        }

        /* New Symbol Icon Links (for ⛶ and ⟳) */
        .icon-symbol {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #ccc;
            background-color: #1e1e1e;
            border-radius: 12px;
            transition: all 0.4s ease;
            border: 1px solid transparent;
        }

        /* Sidebar Tooltip */
        .sidebar-link .tooltip {
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1e1e1e;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            border: 1px solid #bf00ff;
            box-shadow: 0 0 10px rgba(191, 0, 255, 0.4);
            z-index: 999;
        }

        /* Hover effects */
        .sidebar-link:hover img {
            opacity: 1;
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.8);
        }

        .sidebar-link:hover .icon-symbol {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.8);
            border-color: #bf00ff;
            color: #bf00ff;
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.8);
        }

        .sidebar-link:hover .tooltip {
            opacity: 1;
            left: 80px;
        }

        .sidebar-extra-img {
            margin-top: auto; 
            width: 50px;
            height: 50px;
            border-radius: 50%; 
            opacity: 0.4;
            margin-bottom: 10px;
            pointer-events: none; 
        }

        .sidebar-divider {
            width: 50px;
            height: 2px;
            background-color: #333;
            margin: 10px 0 25px 0;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px 40px;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        /* --- Iframe Styles --- */
        .content-frame {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            border: 2px solid #333;
            border-radius: 20px;
            display: none; 
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.2);
            background-color: #121212;
            transition: all 0.5s ease;
        }

        /* --- Custom Internal Page Styles --- */
        .custom-page-container {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #121212;
            border: 2px solid #333;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.2);
            animation: fadeIn 0.5s ease-out;
            padding: 40px;
        }

        .custom-page-container h1 {
            font-size: 3rem;
            color: #bf00ff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(191, 0, 255, 0.6);
        }

        .custom-page-container p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.6;
        }

        .real-link-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            color: white;
            background: transparent;
            border: 2px solid #bf00ff;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.4);
            cursor: pointer;
            display: inline-block;
        }

        .real-link-btn:hover {
            background: #bf00ff;
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.8);
            transform: scale(1.05);
        }

        /* --- Search Bar Styles --- */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px; 
            animation: slideDown 0.8s ease-out;
            flex-shrink: 0;
            gap: 8px;
        }

        .search-bar {
            width: 100%;
            max-width: 520px;
            padding: 15px 25px;
            font-size: 18px;
            background-color: #1e1e1e;
            color: white;
            border: 2px solid #333;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.6);
            transform: scale(1.02);
            background-color: #121212;
        }

        /* --- Image Grid / Apps List Styles --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto; 
            padding: 20px; 
        }

        .grid-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 1s ease-out backwards;
            background-color: #000;
            height: 200px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: all 0.5s ease;
            filter: brightness(80%);
        }

        .grid-item .center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            color: white;
            font-size: 26px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 30px #000;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            text-align: center;
            width: 90%; 
            white-space: normal; 
            word-wrap: break-word; 
            line-height: 1.2; 
        }

        .grid-item:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(191, 0, 255, 0.5);
            z-index: 2;
        }

        .grid-item:hover img {
            filter: brightness(30%);
            transform: scale(1.1);
        }

        .grid-item:hover .center-text {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .app-card { padding: 12px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; justify-content:flex-start; }
        .app-card .title { font-size:18px; color:#fff; }
        .app-card .meta { font-size:12px; color:#bbb; }
        .app-actions { margin-left:auto; display:flex; gap:8px; }
        .small-btn { background:#222; color:#fff; border:1px solid #333; padding:6px 10px; border-radius:8px; cursor:pointer; }

        /* Modal */
        .modal { position: fixed; left:50%; top:50%; transform: translate(-50%,-50%); background:#121212; border:1px solid #333; padding:16px; border-radius:10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index:2000; }
        .modal[hidden]{display:none}
        .modal input, .modal select { width: 100%; padding:8px; margin:8px 0; border-radius:8px; border:1px solid #222; background:#0f0f0f; color:#fff }

        /* Remove button for custom items */
        .remove-custom { position:absolute; right:10px; top:10px; background:rgba(0,0,0,0.6); border:none; color:#fff; width:28px; height:28px; border-radius:6px; cursor:pointer }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-link interactive-link" data-url="home">
            <img src="https://via.placeholder.com/100/333333/bf00ff?text=H" alt="Home">
            <span class="tooltip">Home View</span>
        </div>
        <div class="sidebar-link interactive-link" data-url="special-page">
            <img src="https://via.placeholder.com/100/333333/bf00ff?text=S" alt="Special Page">
            <span class="tooltip">Special Page</span>
        </div>
        
        <div class="sidebar-link interactive-link" data-url="https://en.wikipedia.org/wiki/Main_Page">
            <img src="https://via.placeholder.com/100/333333/bf00ff?text=W" alt="Wiki">
            <span class="tooltip">Wikipedia</span>
        </div>

        <div class="sidebar-link" id="googleSidebarBtn">
            <img src="https://via.placeholder.com/100/333333/bf00ff?text=G" alt="Google">
            <span class="tooltip">Open Google</span>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-link action-btn" id="btnFullscreen">
            <div class="icon-symbol">⛶</div>
            <span class="tooltip">Fullscreen Iframe</span>
        </div>
        <div class="sidebar-link action-btn" id="btnRefresh">
            <div class="icon-symbol">⟳</div>
            <span class="tooltip">Refresh Iframe</span>
        </div>

        <img class="sidebar-extra-img" src="https://via.placeholder.com/100/111111/555555?text=Img" alt="Bottom Image">
    </nav>

    <main class="main-content">
        
        <iframe id="contentFrame" class="content-frame"></iframe>

        <div id="customPage" class="custom-page-container">
            <h1>Secret Hub Page</h1>
            <p>Welcome to the custom internal page! This page replaces the grid but isn't loaded from an external website. You can put any custom HTML you want right here.</p>
            <div id="googleInternalBtn" class="real-link-btn">Open Google in New Tab</div>
        </div>

        <div class="search-container" id="searchContainer">
            <input type="text" id="searchBar" class="search-bar" placeholder="Type a link name to filter...">
            <button id="addBtn" class="small-btn">Add</button>
        </div>

        <!-- Unified Apps section (replaces separate apps/games) -->
        <div class="grid-container" id="gridContainer" aria-live="polite">
            <!-- Items will be rendered here by JS -->
        </div>

        <!-- Add modal -->
        <div class="modal" id="addModal" hidden>
            <h3 style="color:#fff">Add custom item</h3>
            <form id="addForm">
                <label style="color:#ccc">Name<input name="name" required></label>
                <label style="color:#ccc">URL<input name="url" type="url" placeholder="https://example.com"></label>
                <label style="color:#ccc">Type
                    <select name="type">
                        <option value="app">App</option>
                        <option value="game">Game</option>
                    </select>
                </label>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px">
                    <button type="submit" class="small-btn">Add</button>
                    <button type="button" id="cancelAdd" class="small-btn">Cancel</button>
                </div>
            </form>
        </div>

    </main>

    <script>
        // New unified apps/games functionality
        (function(){
            const STORAGE_KEY = 'unbreaking_custom_apps_v1';

            // Built-in items (from the previous static grid)
            const builtIns = [
                { id: 'g-1', name: 'AWESOME GAMES', url: 'https://en.wikipedia.org/wiki/Video_game', type: 'game', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Games' },
                { id: 'a-1', name: 'SICK BEATS', url: 'https://en.wikipedia.org/wiki/Music', type: 'app', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Music' },
                { id: 'a-2', name: 'COOL VIDEOS', url: 'https://en.wikipedia.org/wiki/Video', type: 'app', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Videos' },
                { id: 'a-3', name: 'DIGITAL ART', url: 'https://en.wikipedia.org/wiki/Art', type: 'app', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Art' },
                { id: 'a-4', name: 'COMPLEX CODING PROJECTS', url: 'https://en.wikipedia.org/wiki/Computer_programming', type: 'app', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Code' },
                { id: 'a-5', name: 'SOCIAL MEDIA', url: 'https://en.wikipedia.org/wiki/Social_media', type: 'app', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Social' }
            ];

            function loadCustom(){
                try{ const raw = localStorage.getItem(STORAGE_KEY); return raw? JSON.parse(raw):[] }catch(e){ return [] }
            }
            function saveCustom(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)) }

            let customItems = loadCustom();
            let items = [...builtIns, ...customItems];

            // DOM
            const gridContainer = document.getElementById('gridContainer');
            const searchBar = document.getElementById('searchBar');
            const addBtn = document.getElementById('addBtn');
            const addModal = document.getElementById('addModal');
            const addForm = document.getElementById('addForm');
            const cancelAdd = document.getElementById('cancelAdd');
            const contentFrame = document.getElementById('contentFrame');
            const searchContainer = document.getElementById('searchContainer');
            const customPage = document.getElementById('customPage');

            function makeId(){ return 'c-'+Date.now()+'-'+Math.floor(Math.random()*1000) }

            function render(q){
                const query = (q||'').toLowerCase().trim();
                gridContainer.innerHTML = '';
                const filtered = items.filter(it => {
                    if(!query) return true;
                    return (it.name||'').toLowerCase().includes(query) || (it.type||'').includes(query);
                });

                if(filtered.length === 0){ gridContainer.innerHTML = '<div style="color:#ccc; text-align:center; width:100%">No results</div>'; return }

                for(const it of filtered){
                    const el = document.createElement('div');
                    el.className = 'grid-item interactive-link';
                    el.setAttribute('data-name', it.name + ' ' + it.type);
                    el.setAttribute('data-url', it.url);

                    const img = document.createElement('img'); img.src = it.img || 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Item'; img.alt = it.name;
                    const center = document.createElement('div'); center.className = 'center-text'; center.textContent = it.name;

                    el.appendChild(img);
                    el.appendChild(center);

                    // if custom, add remove button
                    if(it.source === 'custom'){
                        const rm = document.createElement('button'); rm.className = 'remove-custom'; rm.title = 'Remove'; rm.textContent = '×';
                        rm.addEventListener('click', (ev)=>{ ev.stopPropagation(); removeCustom(it.id); });
                        el.appendChild(rm);
                    }

                    // click behavior
                    el.addEventListener('click', function(){
                        const targetUrl = this.getAttribute('data-url');
                        // hide other UI
                        gridContainer.style.display = 'none';
                        searchContainer.style.display = 'none';
                        customPage.style.display = 'none';
                        contentFrame.style.display = 'none';

                        if(targetUrl === 'home'){
                            contentFrame.src = '';
                            gridContainer.style.display = 'grid';
                            searchContainer.style.display = 'flex';
                        } else if(targetUrl === 'special-page'){
                            contentFrame.src = '';
                            customPage.style.display = 'flex';
                        } else {
                            contentFrame.src = targetUrl;
                            contentFrame.style.display = 'block';
                        }
                    });

                    gridContainer.appendChild(el);
                }
            }

            function addCustom(item){
                const newItem = { id: makeId(), name: item.name, url: item.url||'#', type: item.type||'app', source: 'custom', img: 'https://via.placeholder.com/400x300/1a1a1a/bf00ff?text=Custom' };
                customItems.push(newItem);
                saveCustom(customItems);
                items = [...builtIns, ...customItems];
                render(searchBar.value);
            }

            function removeCustom(id){
                customItems = customItems.filter(i=>i.id !== id);
                saveCustom(customItems);
                items = [...builtIns, ...customItems];
                render(searchBar.value);
            }

            // Events
            searchBar.addEventListener('input', ()=> render(searchBar.value));
            addBtn.addEventListener('click', ()=>{ addModal.hidden = false; addForm.name.focus(); });
            cancelAdd.addEventListener('click', ()=>{ addModal.hidden = true; addForm.reset(); });
            addForm.addEventListener('submit', (e)=>{
                e.preventDefault();
                const fd = new FormData(addForm);
                const name = (fd.get('name')||'').toString().trim();
                const url = (fd.get('url')||'').toString().trim();
                const type = (fd.get('type')||'app').toString();
                if(!name) return alert('Please enter a name.');
                addCustom({ name, url, type });
                addForm.reset(); addModal.hidden = true;
            });

            // Initialize
            document.addEventListener('DOMContentLoaded', ()=> render());
            if(document.readyState === 'complete' || document.readyState === 'interactive') render();

            // Expose minimal API
            window.UnbreakingApps = { addCustom, removeCustom, list: ()=> items.slice(), clearCustom: ()=>{ customItems = []; saveCustom(customItems); items = [...builtIns]; render(); } }

            // Keep other existing sidebar buttons behavior
            document.getElementById('googleSidebarBtn').addEventListener('click', () => { window.open('https://google.com', '_blank'); });
            document.getElementById('googleInternalBtn')?.addEventListener('click', () => { window.open('https://google.com', '_blank'); });
            const btnFullscreen = document.getElementById('btnFullscreen');
            btnFullscreen.addEventListener('click', () => {
                if (contentFrame.style.display === 'block') {
                    if (contentFrame.requestFullscreen) {
                        contentFrame.requestFullscreen();
                    } else if (contentFrame.webkitRequestFullscreen) {
                        contentFrame.webkitRequestFullscreen();
                    } else if (contentFrame.msRequestFullscreen) {
                        contentFrame.msRequestFullscreen();
                    }
                } else {
                    alert("Please open an external link in the iframe before making it fullscreen!");
                }
            });
            const btnRefresh = document.getElementById('btnRefresh');
            btnRefresh.addEventListener('click', () => {
                if (contentFrame.style.display === 'block' && contentFrame.src !== '') {
                    const currentUrl = contentFrame.src;
                    contentFrame.src = currentUrl;
                } else {
                    alert("No external page is currently open to refresh.");
                }
            });
        })();
    </script>
</body>
</html>
